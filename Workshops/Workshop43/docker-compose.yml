services:
  api:
    build: .
    container_name: api
    environment:
      EC2_HOSTNAME: ${EC2_HOSTNAME:-hostname-ec2-no-configurado}
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
